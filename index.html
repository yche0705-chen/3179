
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Birds as Pets | FIT3179 DV2</title>

  <script src="https://cdn.jsdelivr.net/npm/vega@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-lite@5"></script>
  <script src="https://cdn.jsdelivr.net/npm/vega-embed@6"></script>
</head>
<body>
  <h1>Birds as Pets in Australia</h1>
  <p>Exploring bird ownership, species and wild distributions.</p>

  <div id="chart1"></div>

  <script>
    const spec = {
      "$schema": "https://vega.github.io/schema/vega-lite/v5.json",
      "width": 450,
      "height": 250,
      "data": {
        "values": [
          {"species": "Budgerigar", "value": 10},
          {"species": "Cockatiel", "value": 7},
          {"species": "Canary", "value": 4}
        ]
      },
      "mark": "bar",
      "encoding": {
        "x": {"field": "species", "type": "nominal"},
        "y": {"field": "value", "type": "quantitative"},
        "tooltip": [
          {"field": "species", "type": "nominal"},
          {"field": "value", "type": "quantitative"}
        ]
      }
    };

    vegaEmbed("#chart1", spec, {actions: false})
      .catch(console.error);
  </script>
</body>
</html>
